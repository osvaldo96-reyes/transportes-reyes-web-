<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00AEEF" />
    </linearGradient>
  </defs>

  <!-- ================= 1. TOP CYAN ARCH ================= -->
  <path d="M 185 285 C 178 140, 280 32, 515 30 C 695 28, 795 110, 846 220" 
        fill="none" 
        stroke="#00AEEF" 
        stroke-width="22" 
        stroke-linecap="round" />

  <!-- ================= 2. GROUND SWOOSH ================= -->
  <path d="M 135 306 C 260 292, 450 286, 640 292 C 730 295, 810 300, 868 306" 
        fill="none" 
        stroke="#0B3D91" 
        stroke-width="8.5" 
        stroke-linecap="round" />

  <!-- ================= 3. TANKER TRUCK ================= -->
  <!-- Rear Wheels Mudguard Arch -->
  <path d="M 264 296 C 264 246, 396 246, 396 296" 
        fill="none" 
        stroke="#0B3D91" 
        stroke-width="6" />

  <!-- Rear Dual Wheels -->
  <g transform="translate(300, 276)">
    <circle cx="0" cy="0" r="26" fill="#0B3D91" />
    <circle cx="0" cy="0" r="18" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="13" fill="#0B3D91" />
    <circle cx="0" cy="0" r="6.5" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="3" fill="#0B3D91" />
  </g>
  <g transform="translate(356, 276)">
    <circle cx="0" cy="0" r="26" fill="#0B3D91" />
    <circle cx="0" cy="0" r="18" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="13" fill="#0B3D91" />
    <circle cx="0" cy="0" r="6.5" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="3" fill="#0B3D91" />
  </g>

  <!-- Undercarriage Battery Box / Fuel Tank -->
  <path d="M 390 270 L 575 270 L 575 286 L 390 286 Z" fill="#0B3D91" />
  <rect x="415" y="268" width="95" height="17" rx="3" fill="#072559" stroke="#0B3D91" stroke-width="2" />
  <line x1="420" y1="273" x2="505" y2="273" stroke="#FFFFFF" stroke-width="2" />
  <line x1="420" y1="279" x2="505" y2="279" stroke="#FFFFFF" stroke-width="2" />
  <rect x="520" y="270" width="55" height="15" rx="3" fill="#072559" stroke="#FFFFFF" stroke-width="1.5" />

  <!-- Front Steer Wheel (3/4 perspective) -->
  <g transform="translate(678, 290)">
    <circle cx="0" cy="0" r="33" fill="#0B3D91" />
    <ellipse cx="-1" cy="0" rx="22" ry="24" fill="#FFFFFF" />
    <circle cx="-1" cy="0" r="15" fill="#0B3D91" />
    <circle cx="-1" cy="-10" r="2" fill="#FFFFFF" />
    <circle cx="8" cy="-5" r="2" fill="#FFFFFF" />
    <circle cx="7" cy="6" r="2" fill="#FFFFFF" />
    <circle cx="-4" cy="10" r="2" fill="#FFFFFF" />
    <circle cx="-10" cy="2" r="2" fill="#FFFFFF" />
    <circle cx="-1" cy="0" r="6" fill="#FFFFFF" />
    <circle cx="-1" cy="0" r="3.5" fill="#0B3D91" />
  </g>

  <!-- Tank Body -->
  <path d="M 265 240 
           C 240 238, 238 180, 248 145 
           C 260 95, 335 84, 510 84 
           C 560 84, 585 98, 595 128 
           L 580 240 Z" 
        fill="#FFFFFF" 
        stroke="#0B3D91" 
        stroke-width="8.5" 
        stroke-linejoin="round" />

  <!-- Walkway Railing -->
  <path d="M 320 84 L 515 84" stroke="#0B3D91" stroke-width="9" stroke-linecap="round" />
  <line x1="340" y1="74" x2="340" y2="84" stroke="#0B3D91" stroke-width="4.5" />
  <line x1="395" y1="74" x2="395" y2="84" stroke="#0B3D91" stroke-width="4.5" />
  <line x1="450" y1="74" x2="450" y2="84" stroke="#0B3D91" stroke-width="4.5" />
  <line x1="505" y1="74" x2="505" y2="84" stroke="#0B3D91" stroke-width="4.5" />
  <path d="M 330 74 L 510 74" stroke="#0B3D91" stroke-width="4.5" stroke-linecap="round" />

  <!-- Tank Front Seam -->
  <path d="M 536 92 C 562 120, 558 205, 536 238" fill="none" stroke="#0B3D91" stroke-width="4.5" stroke-linecap="round" />

  <!-- Tank Waves -->
  <path d="M 258 214 C 288 214, 330 228, 370 234 C 330 244, 278 244, 252 234 Z" fill="#4CAF50" />
  <path d="M 252 232 C 295 235, 360 252, 425 246 C 485 240, 525 220, 540 220 C 525 238, 475 258, 415 258 C 335 258, 282 245, 252 232 Z" fill="#0B3D91" />
  <path d="M 250 184 C 285 158, 358 168, 412 198 C 472 230, 516 230, 542 208 C 528 224, 468 224, 418 188 C 362 154, 288 146, 248 168 Z" fill="#00AEEF" />

  <!-- Water Drop -->
  <g transform="translate(488, 158)">
    <path d="M 0 -44 C 0 -44, 25 -6, 25 14 C 25 28, 14 39, 0 39 C -14 39, -25 28, -25 14 C -25 -6, 0 -44, 0 -44 Z" fill="url(#dropGrad)" stroke="#00AEEF" stroke-width="2.5" />
    <path d="M -11 0 C -16 10, -13 23, -4 27 C -10 23, -12 13, -6 5 C -3 1, -7 -5, -11 0 Z" fill="#FFFFFF" opacity="0.95" />
  </g>

  <!-- Truck Cab -->
  <path d="M 570 128 C 605 88, 616 88, 622 108 L 656 126 C 686 140, 726 188, 750 208 C 766 220, 782 246, 785 272 C 785 288, 776 298, 756 300 L 722 300 C 716 258, 642 254, 635 298 L 570 290 Z" fill="#FFFFFF" stroke="#0B3D91" stroke-width="8" stroke-linejoin="round" />
  <path d="M 602 90 C 610 78, 618 84, 620 106" fill="#0B3D91" />
  <path d="M 596 144 L 646 144 L 646 194 L 596 194 Z" fill="#0B3D91" rx="3" />
  <line x1="596" y1="170" x2="646" y2="170" stroke="#FFFFFF" stroke-width="2" opacity="0.35" />
  <path d="M 658 140 L 716 156 C 736 178, 744 196, 748 208 L 660 198 Z" fill="#0B3D91" />
  <path d="M 670 146 L 705 158 L 680 196 L 666 194 Z" fill="#00AEEF" opacity="0.3" />
  <line x1="714" y1="158" x2="706" y2="202" stroke="#FFFFFF" stroke-width="2.5" />
  <rect x="584" y="150" width="5.5" height="25" rx="2" fill="#0B3D91" />
  <line x1="590" y1="158" x2="598" y2="160" stroke="#0B3D91" stroke-width="2.5" />
  <line x1="590" y1="170" x2="598" y2="168" stroke="#0B3D91" stroke-width="2.5" />
  <path d="M 584 136 L 652 138 L 652 258 L 584 258 Z" fill="none" stroke="#0B3D91" stroke-width="3.5" stroke-linejoin="round" />
  <rect x="596" y="208" width="11" height="4" rx="1.5" fill="#0B3D91" />
  <path d="M 755 228 C 760 242, 765 268, 765 284 L 826 284 C 836 284, 842 274, 840 258 C 836 236, 805 222, 755 228 Z" fill="#FFFFFF" stroke="#0B3D91" stroke-width="5.5" />
  <g transform="translate(764, 236)">
    <path d="M 0 0 L 60 5 C 65 25, 65 42, 60 48 L 0 45 Z" fill="#0B3D91" />
    <line x1="8" y1="12" x2="52" y2="15" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
    <line x1="8" y1="24" x2="52" y2="26" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
    <line x1="8" y1="36" x2="52" y2="38" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
  </g>
  <path d="M 726 250 L 750 254 L 746 270 L 724 264 Z" fill="#00AEEF" stroke="#0B3D91" stroke-width="2.5" />
  <circle cx="736" cy="260" r="3.5" fill="#FFFFFF" />
  <path d="M 716 292 L 836 292 C 842 292, 844 302, 838 305 L 716 305 Z" fill="#0B3D91" />

  <!-- "TRANSPORTES" -->
  <g transform="translate(145, 360)">
    <text x="0" y="0" 
          font-family="'Montserrat', 'Arial Black', 'Trebuchet MS', sans-serif" 
          font-size="64" 
          font-weight="900" 
          font-style="italic" 
          letter-spacing="5" 
          fill="#0B3D91">
      TRANSPORTES
    </text>
  </g>

  <!-- "Reyes" Script with Leaves -->
  <g transform="translate(150, 480)">
    <path d="M 280 25 C 380 44, 570 38, 710 -15 C 640 8, 480 14, 310 -4 Z" fill="#00AEEF" />
    <g transform="translate(735, -25)">
      <path d="M 0 0 C 16 -24, 46 -34, 62 -28 C 64 -10, 52 16, 26 18 C 10 18, 0 10, 0 0 Z" fill="#4CAF50" />
      <path d="M 5 -2 C 22 -13, 40 -17, 50 -19" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8" stroke-linecap="round" />
      <path d="M -16 14 C -9 -6, 12 -12, 26 -9 C 27 4, 15 22, -2 24 C -10 24, -16 20, -16 14 Z" fill="#4CAF50" />
    </g>
    <g fill="#0B3D91">
      <circle cx="18" cy="-88" r="9" />
      <circle cx="18" cy="-88" r="3.5" fill="#00AEEF" />
      <text x="0" y="0" 
            font-family="'Brush Script MT', 'Dancing Script', 'Pacifico', 'Caveat', 'Segoe Script', cursive" 
            font-size="146" 
            font-weight="bold" 
            font-style="italic" 
            letter-spacing="-1" 
            fill="#0B3D91">
        Reyes
      </text>
    </g>
    <path d="M 290 18 C 240 38, 170 36, 115 14 C 170 26, 250 24, 315 -2 Z" fill="#0B3D91" />
  </g>

  <!-- Subtitle Divider Line -->
  <rect x="135" y="522" width="675" height="4.5" rx="2.25" fill="#00AEEF" />

  <!-- Subtitle -->
  <text x="472" y="550" 
        text-anchor="middle" 
        font-family="'Montserrat', 'Arial Black', sans-serif" 
        font-size="22" 
        font-weight="900" 
        letter-spacing="6" 
        fill="#0B3D91">
    SERVICIO DE AGUA POTABLE Y TRATADA
  </text>

  <!-- Bottom Blue Capsule -->
  <g transform="translate(135, 568)">
    <rect x="0" y="0" width="730" height="44" rx="22" fill="#0B3D91" />
    <line x1="35" y1="22" x2="115" y2="22" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <text x="365" y="29" 
          text-anchor="middle" 
          font-family="'Montserrat', 'Arial Black', sans-serif" 
          font-size="20" 
          font-weight="900" 
          letter-spacing="5" 
          fill="#FFFFFF">
      TRANSPORTE Y ACARREOS DE AGUA
    </text>
    <line x1="615" y1="22" x2="695" y2="22" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
